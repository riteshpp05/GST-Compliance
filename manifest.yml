applications:
  - name: uc15-gst-compliance-agent
    memory: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python main.py --ui
    health-check-type: http
    health-check-http-endpoint: /ready
    timeout: 180
    env:
      APP_ENV: demo
      LOG_LEVEL: INFO
      PERSISTENCE_BACKEND: sqlite