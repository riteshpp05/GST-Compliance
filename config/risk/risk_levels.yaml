# UC15 GST Compliance Agent — Risk Level Configuration
# Bounded 0–100 score brackets for risk classification
risk_levels:
  LOW:
    min: 0
    max: 19
    label: "Low Risk"
    description: "Minimal compliance or operational risk. Routine filing."
  MODERATE:
    min: 20
    max: 39
    label: "Moderate Risk"
    description: "Minor compliance observations or low-impact anomalies."
  MEDIUM:
    min: 40
    max: 59
    label: "Medium Risk"
    description: "Notable compliance failure requiring standard remediation."
  HIGH:
    min: 60
    max: 79
    label: "High Risk"
    description: "Serious compliance breach; probable return rejection or tax dispute."
  CRITICAL:
    min: 80
    max: 100
    label: "Critical Risk"
    description: "Severe statutory violation, invalid GSTIN, or mandatory return blocker."
